<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Khazuriel AI - Mentor 3D & Voz</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
        :root { --bg-dark: #030712; --card-bg: rgba(13, 20, 36, 0.90); --border-color: rgba(59, 130, 246, 0.25); }
        html, body { height: 100%; height: 100dvh; margin: 0; overflow: hidden; background-color: var(--bg-dark); color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
        body { background-image: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.15), transparent 50%); display: flex; flex-direction: column; }
        .glass-panel { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); }
        .glass-input { background: rgba(3, 7, 18, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; }
        .glass-input:focus { border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); outline: none; }
        .bottom-safe-area { padding-bottom: max(1.25rem, env(safe-area-inset-bottom, 1.25rem)); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 3px; }
        .chat-content p { margin-bottom: 0.5rem; line-height: 1.5; }
        .chat-content strong { color: #38bdf8; }
        model-viewer { width: 100%; height: 180px; background-color: transparent; outline: none; }
        .recording-active { background-color: #ef4444 !important; border-color: #f87171 !important; }
    </style>
</head>
<body class="text-sm">

    <header class="glass-panel z-10 px-4 py-2 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
            <h1 class="font-bold text-sm bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                KHAZURIEL AI
            </h1>
            <span class="text-[9px] px-1.5 py-0.2 rounded bg-blue-500/20 text-cyan-400 border border-cyan-500/30">PRO v4.8</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="toggle-key-btn" class="p-2 rounded-lg bg-gray-800/60 border border-gray-700 text-gray-300 relative">
                <i data-lucide="key" class="w-4 h-4"></i>
                <span id="key-status-dot" class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-red-500"></span>
            </button>
            <button id="clear-chat-btn" title="Limpar" class="p-2 rounded-lg bg-gray-800/60 border border-gray-700 text-gray-300">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <div id="key-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
        <div class="glass-panel w-full max-w-md p-5 rounded-2xl border border-blue-500/30">
            <h2 class="text-base font-bold text-cyan-400 mb-2">Chave OpenRouter</h2>
            <input type="password" id="api-key-input" placeholder="sk-or-v1-..." class="w-full glass-input p-3 rounded-xl mb-4 text-xs">
            <div class="flex justify-end gap-2">
                <button id="close-key-modal" class="px-4 py-2 rounded-xl text-xs bg-gray-800 text-gray-300">Cancelar</button>
                <button id="save-key-btn" class="px-4 py-2 rounded-xl text-xs bg-blue-600 text-white">Salvar</button>
            </div>
        </div>
    </div>

    <div class="shrink-0 border-b border-blue-900/30 bg-gradient-to-b from-gray-900/50 to-black relative">
        <model-viewer 
            id="avatar-3d"
            src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" 
            camera-controls disable-zoom auto-rotate animation-name="Idle" shadow-intensity="1" exposure="0.8">
        </model-viewer>
        <div class="absolute bottom-2 right-2 flex gap-1 z-10">
            <button id="btn-pause-voice" class="p-1.5 rounded-lg bg-gray-800/80 border border-gray-600 text-yellow-400 hidden">
                <i data-lucide="pause" class="w-4 h-4"></i>
            </button>
            <button id="btn-stop-voice" class="p-1.5 rounded-lg bg-gray-800/80 border border-gray-600 text-red-400 hidden">
                <i data-lucide="square" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <main class="flex-1 flex flex-col min-h-0 relative z-10 overflow-hidden">
        <div id="chat-box" class="flex-1 overflow-y-auto p-3 space-y-3">
            <div class="flex gap-2.5 max-w-3xl">
                <div class="glass-panel p-3.5 rounded-2xl rounded-tl-none text-gray-200 border border-blue-500/20 text-xs md:text-sm">
                    <p><strong>Conexão Estável.</strong> Motor Google Gemma 2 (Gratuito) ativado com sucesso.</p>
                </div>
            </div>
        </div>

        <div class="px-3 pt-2 bottom-safe-area mb-4 glass-panel border-t border-gray-800/80 shrink-0 mx-2 rounded-2xl">
            <form id="chat-form" class="flex items-center gap-2">
                <button type="button" id="mic-btn" title="Falar por voz" class="p-3 rounded-xl bg-gray-800/90 border border-gray-700 text-cyan-400 shrink-0">
                    <i data-lucide="mic" class="w-4 h-4"></i>
                </button>
                <input type="text" id="user-input" placeholder="Digite sua análise..." class="flex-1 glass-input py-3 px-3 rounded-xl text-xs md:text-sm focus:outline-none min-w-0">
                <button type="submit" id="send-btn" class="p-3 bg-blue-600 text-white rounded-xl shadow-lg shrink-0">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const avatar = document.getElementById('avatar-3d');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');
        const btnPauseVoice = document.getElementById('btn-pause-voice');
        const btnStopVoice = document.getElementById('btn-stop-voice');

        let openRouterKey = localStorage.getItem('khazuriel_openrouter_key') || '';
        const apiKeyInput = document.getElementById('api-key-input');
        const keyStatusDot = document.getElementById('key-status-dot');
        const keyModal = document.getElementById('key-modal');

        function updateKeyUI() {
            if (openRouterKey) {
                apiKeyInput.value = openRouterKey;
                keyStatusDot.className = "absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-emerald-500 border border-gray-900";
            } else {
                keyStatusDot.className = "absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-red-500 border border-gray-900";
            }
        }
        updateKeyUI();

        document.getElementById('toggle-key-btn').addEventListener('click', () => keyModal.classList.remove('hidden'));
        document.getElementById('close-key-modal').addEventListener('click', () => keyModal.classList.add('hidden'));
        document.getElementById('save-key-btn').addEventListener('click', () => {
            if (apiKeyInput.value.trim()) {
                openRouterKey = apiKeyInput.value.trim();
                localStorage.setItem('khazuriel_openrouter_key', openRouterKey);
                updateKeyUI();
                keyModal.classList.add('hidden');
            }
        });

        document.getElementById('clear-chat-btn').addEventListener('click', () => {
            chatBox.innerHTML = '';
            synth.cancel();
            messageHistory = [{ role: "system", content: "Você é Khazuriel AI, mentor de trade." }];
        });

        let synth = window.speechSynthesis;
        function lerTextoIA(textoRaw) {
            synth.cancel(); 
            let textoLimpo = textoRaw.replace(/[*#_]/g, '');
            const utterance = new SpeechSynthesisUtterance(textoLimpo);
            utterance.lang = 'pt-PT';
            utterance.rate = 1.1;

            utterance.onstart = () => {
                avatar.setAttribute('animation-name', 'Walking'); 
                btnPauseVoice.classList.remove('hidden');
                btnStopVoice.classList.remove('hidden');
            };
            utterance.onend = () => {
                avatar.setAttribute('animation-name', 'Idle'); 
                btnPauseVoice.classList.add('hidden');
                btnStopVoice.classList.add('hidden');
            };
            synth.speak(utterance);
        }

        btnPauseVoice.addEventListener('click', () => {
            if (synth.speaking && !synth.paused) {
                synth.pause();
                avatar.setAttribute('animation-name', 'Idle');
                btnPauseVoice.innerHTML = '<i data-lucide="play" class="w-4 h-4"></i>';
            } else if (synth.paused) {
                synth.resume();
                avatar.setAttribute('animation-name', 'Walking');
                btnPauseVoice.innerHTML = '<i data-lucide="pause" class="w-4 h-4"></i>';
            }
            lucide.createIcons();
        });

        btnStopVoice.addEventListener('click', () => {
            synth.cancel();
            avatar.setAttribute('animation-name', 'Idle');
            btnPauseVoice.classList.add('hidden');
            btnStopVoice.classList.add('hidden');
        });

        let isRecording = false;
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-PT';
            recognition.continuous = false;

            recognition.onstart = () => { isRecording = true; micBtn.classList.add('recording-active'); };
            recognition.onresult = (event) => { userInput.value = event.results[0][0].transcript; };
            recognition.onend = () => { isRecording = false; micBtn.classList.remove('recording-active'); };
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return alert('Reconhecimento de voz não suportado neste navegador.');
            isRecording ? recognition.stop() : recognition.start();
        });

        let messageHistory = [{ role: "system", content: "Você é Khazuriel AI, especialista institucional. Responda de forma direta e técnica em português." }];

        function appendMessage(role, text) {
            const isUser = role === 'user';
            const msg = document.createElement('div');
            msg.className = `flex gap-2.5 max-w-3xl ${isUser ? 'ml-auto flex-row-reverse' : ''}`;
            msg.innerHTML = `
                <div class="glass-panel p-3.5 rounded-2xl ${isUser ? 'rounded-tr-none border-amber-500/20 bg-amber-950/20' : 'rounded-tl-none border-blue-500/20'} text-gray-200 chat-content text-xs md:text-sm">
                    ${isUser ? text : marked.parse(text)}
                </div>
            `;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            if (!openRouterKey) return keyModal.classList.remove('hidden');

            userInput.value = '';
            appendMessage('user', text);
            messageHistory.push({ role: 'user', content: text });

            const typing = document.createElement('div');
            typing.id = 'typing';
            typing.className = 'glass-panel p-3 max-w-max rounded-2xl rounded-tl-none text-gray-400 text-xs border border-blue-500/20';
            typing.innerText = 'Processando...';
            chatBox.appendChild(typing);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${openRouterKey}`,
                        'HTTP-Referer': 'https://khazuriel-crypto.github.io/', 
                        'X-Title': 'Khazuriel AI',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        // NOVO MOTOR GRATUITO APLICADO AQUI:
                        model: 'google/gemma-2-9b-it:free',
                        messages: messageHistory
                    })
                });

                const data = await response.json();
                typing.remove();

                if (!response.ok) {
                    throw new Error(data.error?.message || `Erro no servidor: ${response.status}`);
                }

                const aiResponse = data.choices[0].message.content;

                messageHistory.push({ role: 'assistant', content: aiResponse });
                appendMessage('assistant', aiResponse);
                
                lerTextoIA(aiResponse);

            } catch (err) {
                typing.remove();
                appendMessage('assistant', `⚠️ **Erro:** ${err.message}`);
            }
        });
    </script>
</body>
</html>
