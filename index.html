Aqui está um código completo e funcional em um único arquivo HTML. Ele utiliza o `<model-viewer>` do Google para renderizar um avatar 3D direto no navegador e a **Web Speech API** nativa para gerar a voz e ler o texto, com botões para controlar a reprodução.

Salve o código abaixo como um arquivo `index.html` e abra-o em qualquer navegador:

```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar 3D com Voz IA</title>
    <!-- Importa a biblioteca do Google para renderizar modelos 3D -->
    <script type="module" src="[https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js](https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js)"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: #121212; 
            color: #ffffff; 
            padding: 20px; 
            margin: 0;
        }
        h2 { margin-bottom: 10px; }
        model-viewer { 
            width: 100%; 
            max-width: 350px; 
            height: 350px; 
            background-color: #1e1e1e; 
            border-radius: 12px; 
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        textarea { 
            width: 100%; 
            max-width: 400px; 
            height: 100px; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background-color: #1e1e1e;
            color: #fff;
            margin-bottom: 20px; 
            resize: none;
        }
        .controls { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            flex-wrap: wrap;
            justify-content: center;
        }
        button { 
            padding: 12px 20px; 
            font-size: 14px; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            color: white; 
            transition: 0.2s;
        }
        button:hover { opacity: 0.8; }
        #btn-play { background-color: #4CAF50; }
        #btn-pause { background-color: #f44336; }
        #btn-resume { background-color: #ff9800; }
    </style>
</head>
<body>

    <h2>Assistente Virtual</h2>
    
    <!-- Avatar 3D (Robô de exemplo gratuito) -->
    <model-viewer 
        src="[https://modelviewer.dev/shared-assets/models/RobotExpressive.glb](https://modelviewer.dev/shared-assets/models/RobotExpressive.glb)" 
        camera-controls 
        auto-rotate 
        animation-name="Idle"
        id="avatar">
    </model-viewer>

    <textarea id="texto-ia">Olá! Eu sou o seu avatar 3D. Escreva qualquer texto aqui, clique em reproduzir e eu vou ler para você.</textarea>

    <div class="controls">
        <button id="btn-play">▶ Reproduzir</button>
        <button id="btn-pause">⏸ Pausar</button>
        <button id="btn-resume">⏯ Continuar</button>
    </div>

    <script>
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnResume = document.getElementById('btn-resume');
        const textArea = document.getElementById('texto-ia');
        const avatar = document.getElementById('avatar');

        let synth = window.speechSynthesis;
        let utterance;

        function iniciarFala() {
            // Cancela qualquer áudio anterior para não encavalar
            synth.cancel();

            const texto = textArea.value;
            if (texto !== '') {
                utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR'; // Define o idioma para Português
                utterance.rate = 1.0; // Velocidade da voz
                
                // Evento: Muda a animação quando começa a falar
                utterance.onstart = () => {
                    avatar.setAttribute('animation-name', 'Walking'); 
                };
                
                // Evento: Volta para animação parada quando termina
                utterance.onend = () => {
                    avatar.setAttribute('animation-name', 'Idle');
                };

                synth.speak(utterance);
            }
        }

        // Ações dos botões
        btnPlay.addEventListener('click', iniciarFala);

        btnPause.addEventListener('click', () => {
            if (synth.speaking && !synth.paused) {
                synth.pause();
                avatar.setAttribute('animation-name', 'Idle'); // Para a animação
            }
        });

        btnResume.addEventListener('click', () => {
            if (synth.paused) {
                synth.resume();
                avatar.setAttribute('animation-name', 'Walking'); // Retoma a animação
            }
        });
    </script>
</body>
</html>
